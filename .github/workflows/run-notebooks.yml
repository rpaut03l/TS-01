name: Run Jupyter Notebooks

on:
  push:
    paths:
      - '**/*.ipynb'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install papermill nbconvert ipykernel jupyter
          python -m ipykernel install --user --name python3

      - name: Execute changed notebooks
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.ipynb' 2>/dev/null || find . -name '*.ipynb' -not -path './.github/*' -not -path '*/.ipynb_checkpoints/*')
          mkdir -p executed_notebooks
          for nb in $CHANGED; do
            if [ -f "$nb" ]; then
              echo ">>> Running: $nb"
              papermill "$nb" "executed_notebooks/$(basename $nb)" \
                --kernel python3 --no-progress-bar --report-mode 2>&1 \
                || echo "::warning::$nb had errors"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebooks-${{ github.run_number }}
          path: executed_notebooks/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## 📓 Notebook Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "| Notebook | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in executed_notebooks/*.ipynb; do
            [ -f "$f" ] && echo "| $(basename $f) | ✅ |" >> $GITHUB_STEP_SUMMARY
          done
